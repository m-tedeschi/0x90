set -g base-index 1

# ─────────────────────────────────────────────────────────────
# Greyscale tmux status bar
# ─────────────────────────────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Hide active window underline
setw -g window-status-current-style none

# Main bar
set -g status-style "bg=#1c1c1c,fg=#bcbcbc"

# Compact left side
set -g status-left-length 22
set -g status-left \
"#[bg=#eeeeee,fg=#1c1c1c,bold] #{=/15/...:session_name} #[bg=#1c1c1c,fg=#eeeeee]"

# Compact window tabs
set -g window-status-separator ""

set -g window-status-format \
"#[bg=#1c1c1c,fg=#808080] #I:#W "

set -g window-status-current-format \
"#[bg=#5f5f5f,fg=#ffffff,bold] #I:#W "

set -g window-status-activity-style \
"bg=#1c1c1c,fg=#ffffff,bold"

# Compact right side
set -g status-right-length 35
set -g status-right \
"#[fg=#5f5f5f]#[bg=#5f5f5f,fg=#ffffff] #H #[fg=#eeeeee]#[bg=#eeeeee,fg=#1c1c1c,bold] %H:%M "

# Pane borders
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#bcbcbc"

# Binding for previous pane with Ctrl + Left Shift + Tab
bind-key P select-pane -t :.-

# Pane indexing starts at 1
setw -g pane-base-index 1

# Recognize the sequences sent by Ghostty.
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"

# Run workspace-flow without typing into the foreground application.
bind-key -n User0 run-shell 'TMUX_PANE=#{pane_id} wf -s'
bind-key -n User1 run-shell 'TMUX_PANE=#{pane_id} wf -S'

# Messages
set -g message-style "bg=#eeeeee,fg=#1c1c1c,bold"
set -g message-command-style "bg=#5f5f5f,fg=#ffffff"

# Copy mode
setw -g mode-style "bg=#bcbcbc,fg=#1c1c1c,bold"

# Reload config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Set history limit to 100,000
set-option -g history-limit 100000


# Hide pane size info when displaying pane numbers
setw -g display-panes-format ''

# Enable mouse scroll
set -g mouse on

# Pane number colors
setw -g display-panes-active-colour "#ffffff"
setw -g display-panes-colour "#5f5f5f"

# Keep pane preview borders dark gray
setw -g display-panes-border-style "fg=#3a3a3a,bg=default"

# Option + number selects numbered pane
bind-key -n M-1 select-pane -t :.1
bind-key -n M-2 select-pane -t :.2
bind-key -n M-3 select-pane -t :.3
bind-key -n M-4 select-pane -t :.4
bind-key -n M-5 select-pane -t :.5
bind-key -n M-6 select-pane -t :.6
bind-key -n M-7 select-pane -t :.7
bind-key -n M-8 select-pane -t :.8
bind-key -n M-9 select-pane -t :.9

# Renumber windows as they close
set -g renumber-windows on

# Option + Shift + / shows pane numberings
bind-key -n M-? display-panes

# Option + [ expands vertically, Option + ] expands horizontally
# Option + { shrinks vertically, Option + } shrinks horizontally
bind-key -n 'M-[' if-shell -F '#{>:#{window_panes},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -r 0 5"' 'display-message "Resizing requires at least 2 panes"'
bind-key -n 'M-]' if-shell -F '#{>:#{window_panes},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -r 5 0"' 'display-message "Resizing requires at least 2 panes"'
bind-key -n 'M-{' if-shell -F '#{>:#{window_panes},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -r 0 -5"' 'display-message "Resizing requires at least 2 panes"'
bind-key -n 'M-}' if-shell -F '#{>:#{window_panes},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -r -5 0"' 'display-message "Resizing requires at least 2 panes"'

# Option + r resets pane layout / sizes
bind-key -n 'M-r' run-shell 'case #{window_panes} in 2|3|4) TMUX_PANE=#{pane_id} "$HOME/.local/bin/wf" -r#{window_panes} ;; *) tmux display-message "Reset requires 2, 3, or 4 panes" ;; esac'

# Option + w closes the current pane
bind-key -n 'M-w' if-shell -F '#{>:#{window_panes},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -cs"' 'display-message "Cannot close the last pane"'

# Option + x closes the current window
bind-key -n 'M-x' if-shell -F '#{>:#{session_windows},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -cw"' 'display-message "Cannot close the last window"'

# Option + n creates new window
bind-key -n 'M-n' run-shell -c '#{pane_current_path}' 'TMUX_PANE=#{pane_id} "$HOME/.local/bin/wf" -n'

# Option + q quad splits
bind-key -n 'M-q' if-shell -F '#{==:#{window_panes},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -q"' 'display-message "Quad layout requires exactly 1 pane"'

# Option + t triple splits
bind-key -n 'M-t' if-shell -F '#{==:#{window_panes},1}' 'run-shell "TMUX_PANE=#{pane_id} \"$HOME/.local/bin/wf\" -t"' 'display-message "Triple layout requires exactly 1 pane"'

# Option + s vertically splits
bind-key -n 'M-s' run-shell 'TMUX_PANE=#{pane_id} "$HOME/.local/bin/wf" -s'

# Option + Shift + s horizontally splits
bind-key -n 'M-S' run-shell 'TMUX_PANE=#{pane_id} "$HOME/.local/bin/wf" -S'
